<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HELIOS — 3D Solar System Simulation & Telemetry</title>
  <meta name="description" content="Minimalist, mathematically accurate 3D Solar System simulation with real-time Keplerian orbital physics and observatory telemetry.">

  <!-- Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">

  <!-- Importmap for Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Observatory HUD Top Bar -->
  <header class="hud-header">
    <div class="brand-section">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-title">HELIOS</div>
        <div class="brand-subtitle">SOLAR DYNAMICS & TELEMETRY</div>
      </div>
    </div>

    <div class="telemetry-header-meta">
      <div id="epoch-display" class="epoch-indicator">
        <span class="epoch-label">SIMULATION EPOCH:</span>
        <span class="epoch-val">2026-01-01</span>
      </div>
      <div id="fps-display" class="fps-badge">60 FPS</div>
    </div>

    <div class="hud-actions">
      <button id="scale-toggle" class="hud-btn" title="Toggle between Exploration Scale and True Astronomical Orbit Scale">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12h8m-4-4v8"/>
        </svg>
        <span class="toggle-label">EXPLORATION SCALE</span>
      </button>

      <button id="btn-reset-view" class="hud-btn" title="Reset camera to top-down solar perspective (Esc)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>RESET VIEW</span>
      </button>
    </div>
  </header>

  <!-- Bottom Floating Control Dock -->
  <nav class="control-dock">
    <!-- Quick Celestial Body Selector -->
    <div class="dock-card quick-bar-card">
      <div id="body-quick-bar" class="body-chips-container">
        <!-- Injected via js/ui.js -->
      </div>
    </div>

    <!-- Timeline & Warp Controls -->
    <div class="dock-card">
      <div class="time-controls">
        <button id="btn-play-pause" class="play-pause-btn" title="Toggle Play / Pause (Spacebar)">
          <span class="play-pause-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </span>
        </button>

        <div id="warp-presets" class="warp-presets">
          <!-- Preset buttons injected via js/ui.js -->
        </div>

        <div class="slider-group">
          <input id="warp-slider" class="warp-slider" type="range" min="-3" max="3" step="0.05" value="0" title="Scrub simulation speed multiplier">
          <span id="warp-value-text" class="warp-badge">1x</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hover Tooltip -->
  <div id="hover-tooltip" class="hover-tooltip"></div>

  <!-- Keyboard Hints Footer -->
  <footer class="keyboard-hints">
    [SPACE] PLAY/PAUSE &bull; [ESC] RESET VIEW &bull; [DRAG] ROTATE &bull; [SCROLL] ZOOM &bull; [RIGHT-CLICK] PAN
  </footer>

  <!-- Telemetry Slide-in Drawer -->
  <aside id="telemetry-drawer" class="telemetry-drawer">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <h2 id="telemetry-title" class="drawer-title">PLANET</h2>
        <span id="telemetry-type" class="drawer-type">TERRESTRIAL</span>
      </div>
      <button id="telemetry-close" class="drawer-close-btn" title="Close Drawer (Esc)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div id="telemetry-stats" class="drawer-content">
      <!-- Injected dynamically via js/ui.js -->
    </div>
  </aside>

  <!-- Main Application Bootstrap -->
  <script type="module">
    import { SimulationEngine } from './js/engine.js';
    import { UIController } from './js/ui.js';

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('canvas-container');
      const engine = new SimulationEngine(container);
      const ui = new UIController(engine);

      // Start render loop
      engine.render();

      // Expose globally for debugging/inspection
      window.HELIOS = { engine, ui };
    });
  </script>
</body>
</html>
